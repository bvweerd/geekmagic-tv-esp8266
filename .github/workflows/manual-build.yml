name: Manual Firmware Build

on:
  workflow_dispatch:
    inputs:
      debug_build:
        description: "Build with debug optimizations?"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build Firmware
        run: |
          if [ "${{ github.event.inputs.debug_build }}" = "true" ]; then
            echo "⚙ Debug build"
            pio run -e nodemcuv2_debug
          else
            echo "🚀 Release build"
            pio run -e nodemcuv2
          fi

      - name: Upload firmware.bin artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartclock-firmware
          path: |
            .pio/build/nodemcuv2/firmware.bin
            .pio/build/nodemcuv2_debug/firmware.bin
          retention-days: 7
